name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: Schema (migrations and seed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arquila_test
          POSTGRES_USER: arquila
          POSTGRES_PASSWORD: arquila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arquila -d arquila_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://arquila:arquila@localhost:5432/arquila_test
    steps:
      - uses: actions/checkout@v4
      - name: Check the migration file names
        run: bash scripts/check_migrations.sh
      - name: Check that the test accounts cannot reach production
        run: |
          bash scripts/test_seed_guard.sh
          if grep -nE 'seeds/|seed_demo_50|test_accounts|demo_50' seed.sql scripts/init.sh scripts/reset_demo.sh .github/workflows/deploy.yml .github/workflows/reset-demo.yml; then
            echo "An automatic path loads the test accounts"
            exit 1
          fi
      - name: Check that psycopg can run the migrations
        run: |
          if grep -n '%' migrations/*.sql seed.sql; then
            echo "psycopg reads a percent sign as a placeholder"
            exit 1
          fi
      - name: Create the schema and load the seed data
        run: bash scripts/init.sh --seed
      - name: Run it again to check that nothing is applied twice
        run: bash scripts/init.sh --seed
      - name: Restore the demo data over a changed database
        run: |
          psql "${DATABASE_URL/+psycopg/}" --quiet --set ON_ERROR_STOP=1 --command "DELETE FROM projects WHERE name = 'Edificio Mirador'"
          bash scripts/reset_demo.sh
          projects=$(psql "${DATABASE_URL/+psycopg/}" --tuples-only --no-align --command "SELECT count(*) FROM projects")
          test "$projects" = "3"
      - name: Refuse the test accounts on a database without the local mark
        run: |
          url="${DATABASE_URL/+psycopg/}"
          test_accounts() {
            psql "$url" -XtAc "SELECT count(*) FROM users WHERE email IN ('admin@example.com', 'architect@example.com', 'viewer@example.com')"
          }
          test "$(test_accounts)" = "0"
          if out=$(bash scripts/seed_demo_50.sh 2>&1); then
            echo "Loaded without the mark"
            exit 1
          fi
          grep -qF "marked as local" <<< "$out"
          test "$(test_accounts)" = "0"
          # Plain psql goes on after an error: the files must refuse on their own.
          psql "$url" -X --file seeds/test_accounts.sql || true
          psql "$url" -X --file seeds/demo_50.sql || true
          test "$(test_accounts)" = "0"
          test "$(psql "$url" -XtAc "SELECT count(*) FROM projects WHERE latitude IS NOT NULL")" = "0"
      - name: Load the 50 demo projects twice and count them
        run: |
          url="${DATABASE_URL/+psycopg/}"
          psql "$url" -X --set ON_ERROR_STOP=1 --command "ALTER DATABASE arquila_test SET arquila.environment = 'local'"
          bash scripts/seed_demo_50.sh
          bash scripts/seed_demo_50.sh
          owned() {
            psql "$url" -XtAc "SELECT count(*) FROM projects p JOIN users u ON u.id = p.owner_id WHERE u.email = '$1@example.com'"
          }
          test "$(owned architect)" = "20"
          test "$(owned admin)" = "20"
          test "$(owned viewer)" = "10"
          count() {
            psql "$url" -XtAc "SELECT count(*) FROM $1 WHERE project_id IN (SELECT p.id FROM projects p JOIN users u ON u.id = p.owner_id WHERE u.email IN ('admin@example.com', 'architect@example.com', 'viewer@example.com'))"
          }
          test "$(count terrains)" = "50"
          test "$(count plans)" = "75"
          test "$(count rooms)" = "300"
          test "$(count structural_components)" = "200"
          test "$(psql "$url" -XtAc "SELECT count(*) FROM projects WHERE latitude IS NOT NULL")" = "50"
          for role in admin architect viewer; do
            test "$(psql "$url" -XtAc "SELECT string_agg(r.name, ',') FROM user_roles ur JOIN roles r ON r.id = ur.role_id JOIN users u ON u.id = ur.user_id WHERE u.email = '$role@example.com'")" = "$role"
          done
      - name: Check that the new rules reject bad rows
        run: |
          url="${DATABASE_URL/+psycopg/}"
          rejects() {
            if out=$(psql "$url" -X --quiet --set ON_ERROR_STOP=1 --command "$2" 2>&1); then
              echo "Accepted: $2"
              exit 1
            fi
            grep -qF "\"$1\"" <<< "$out" || { echo "$out"; exit 1; }
          }
          rejects projects_latitude_range "UPDATE projects SET latitude = 91, longitude = 0"
          rejects projects_longitude_range "UPDATE projects SET latitude = 0, longitude = 181"
          rejects projects_location_zoom_range "UPDATE projects SET location_zoom = 20"
          rejects projects_coordinates_together "UPDATE projects SET latitude = 1, longitude = NULL"
          rejects ai_extractions_status_known "INSERT INTO ai_extractions (user_id, status) SELECT id, 'unknown' FROM users LIMIT 1"
      - name: Keep the quota rows when their project is deleted
        run: |
          url="${DATABASE_URL/+psycopg/}"
          run() { psql "$url" -X --quiet --set ON_ERROR_STOP=1 --command "$1"; }
          run "INSERT INTO ai_extractions (project_id, user_id) SELECT id, owner_id FROM projects WHERE latitude IS NOT NULL ORDER BY id LIMIT 1"
          run "DELETE FROM projects WHERE id IN (SELECT project_id FROM ai_extractions)"
          test "$(psql "$url" -XtAc "SELECT count(*) FROM ai_extractions WHERE project_id IS NULL")" = "1"
      - name: Roll back 016 and 017 and apply them again
        run: |
          url="${DATABASE_URL/+psycopg/}"
          state() {
            psql "$url" -XtAc "SELECT
              (SELECT count(*) FROM information_schema.tables WHERE table_name = 'ai_extractions')
              + (SELECT count(*) FROM information_schema.columns WHERE table_name = 'projects' AND column_name IN ('latitude', 'longitude', 'location_zoom'))
              + (SELECT count(*) FROM pg_constraint WHERE conname IN ('projects_latitude_range', 'projects_longitude_range', 'projects_location_zoom_range', 'projects_coordinates_together'))
              + (SELECT count(*) FROM schema_migrations WHERE left(version, 3) IN ('016', '017'))"
          }
          test "$(state)" = "10"
          for file in migrations/016_*.sql migrations/017_*.sql; do
            psql "$url" -X --quiet --set ON_ERROR_STOP=1 --single-transaction --file "$file"
          done
          test "$(state)" = "10"
          for number in 017 016; do
            psql "$url" -X --quiet --set ON_ERROR_STOP=1 --single-transaction --file "rollback/${number}_down.sql"
          done
          test "$(state)" = "0"
          bash scripts/init.sh
          test "$(state)" = "10"
      - name: Check the applied migrations
        run: |
          applied=$(psql "${DATABASE_URL/+psycopg/}" --tuples-only --no-align --command "SELECT count(*) FROM schema_migrations")
          expected=$(ls migrations/*.sql | wc -l)
          test "$applied" = "$expected"
